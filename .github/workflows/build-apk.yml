name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Prepare HTML Files & Build APK
      run: |
        mkdir -p www
        cp code.html www/index.html
        if [ -f DESIGN.md ]; then cp DESIGN.md www/; fi
        if [ -f screen.png ]; then cp screen.png www/; fi
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        npx cap init StitchApp com.stitch.app --web-dir www
        npx cap add android
        npx cap copy android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stitch-app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
